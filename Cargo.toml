# =============================================================================
# File:     Cargo.toml
# Location: laser-cnc-controller/Cargo.toml
# Version:  v0.2.3
# Comments: Package manifest. v0.1.4: project management, run records, daily log.
#           v0.1.5: threaded LaserGRBL-style buffered streaming, connection
#           info, Unlock, manual command line. No dependency changes.
#           v0.1.6: job origin marker, work fence, Trace, live run view,
#           G92 zeroing, Spot toggle. No dependency changes.
#           v0.1.7: Simulate mode (virtual GRBL). No dependency changes.
#           v0.1.8: Shape Properties in the right column, jog steps, stream
#           count fix. No dependency changes.
#           v0.1.9: persistent Machine Profile, 5 mm default grid.
#           chrono added for local timestamps in run records, logs and exports.
#           eframe "persistence" feature enabled for saved panel layout.
#           v0.2.0: Cargo workspace. New member crates/motion-planner (no_std
#           GRBL-style planner), used for the head animation, Simulate motion
#           and the job time estimate.
#           v0.2.1: canvas CAD update. geo (polygon union, offsets; default
#           features off) for merge, traces, borders and fills. ab_glyph and
#           epaint_default_fonts (already used by egui, same versions) for
#           outline-font text. geo 0.33 needs Rust 1.88 or newer.
#           v0.2.2: Projects / Active Project panels, burn / travel time in Job
#           Details, run countdown on the canvas. No dependency changes.
#           v0.2.3: live view synced to controller position reports; passes
#           cleaned of moves under 0.05 mm. motion-planner 0.1.1. No new
#           dependencies.
# =============================================================================
[package]
name = "laser-cnc-controller"
version = "0.2.3"
edition = "2021"
description = "Local laser CNC geometry editor and GRBL 0.9i controller"

[workspace]
members = [".", "crates/motion-planner"]

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2.4"
serialport = { version = "4.7", default-features = false }
chrono = "0.4"
motion-planner = { path = "crates/motion-planner" }
geo = { version = "0.33", default-features = false }
ab_glyph = "0.2.32"
epaint_default_fonts = "0.31.1"
# =============================================================================
# End of file: Cargo.toml
# Location:    laser-cnc-controller/Cargo.toml
