# =============================================================================
# File:     Cargo.toml
# Location: laser-cnc-controller/Cargo.toml
# Version:  v0.1.9
# Comments: Package manifest. v0.1.4: project management, run records, daily log.
#           v0.1.5: threaded LaserGRBL-style buffered streaming, connection
#           info, Unlock, manual command line. No dependency changes.
#           v0.1.6: job origin marker, work fence, Trace, live run view,
#           G92 zeroing, Spot toggle. No dependency changes.
#           v0.1.7: Simulate mode (virtual GRBL). No dependency changes.
#           v0.1.8: Shape Properties in the right column, jog steps, stream
#           count fix. No dependency changes.
#           v0.1.9: persistent Machine Profile, 5 mm default grid.
#           chrono added for local timestamps in run records, logs and exports.
#           eframe "persistence" feature enabled for saved panel layout.
# =============================================================================
[package]
name = "laser-cnc-controller"
version = "0.1.9"
edition = "2021"
description = "Local laser CNC geometry editor and GRBL 0.9i controller"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2.4"
serialport = { version = "4.7", default-features = false }
chrono = "0.4"
# =============================================================================
